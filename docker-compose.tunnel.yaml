name: couchbase
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: couchbase/server:latest
    container_name: couchbase-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    stdin_open: true
    tty: true
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: couchbase-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      COUCHBASE_BUCKET: ${DB_CREATE_DATABASE_NAME:-default}
      COUCHBASE_BUCKET_RAMSIZE: ${COUCHBASE_BUCKET_RAMSIZE:-1024}
      COUCHBASE_ADMINISTRATOR_USERNAME: ${DB_ADMIN_NAME:-admin}
      COUCHBASE_ADMINISTRATOR_PASSWORD: ${DB_ADMIN_PASS:-changeme_admin_password}
    ports:
      - '8092-8097:8092-8097'
      - '11207:11207'
      - '11280:11280'
      - '18091-18097:18091-18097'
    volumes:
      - './volumes/db/couchbase/couchbase:/opt/couchbase/var:z'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:8091/pools || exit 1']
      interval: 10s
      timeout: 10s
      retries: 5
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://couchbase-app:8091'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - couchbase
      - cloudflare


networks:
  couchbase:
    name: couchbase
    external: false
  cloudflare:
    external: true
